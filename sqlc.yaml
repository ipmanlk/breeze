version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/migration/"
    queries: "internal/store/queries/"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_pointers_for_null_types: true
        overrides:
          - column: "users.role"
            go_type:
              type: "string"
