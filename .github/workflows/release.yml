name: Release

# Build and publish a GitHub release for every pushed tag of the form v*.*.*.
# Binaries are cross-compiled for each platform; the SPA is embedded into the
# Go binary (pure-Go SQLite, CGO disabled) so every asset is fully
# self-contained. Release notes are auto-generated by GitHub from the tag.
#
# To cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Don't cancel a release build halfway through; let in-flight matrix jobs finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 so `git describe --tags` can resolve the version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install UI dependencies
        run: cd ui && deno install

      - name: Build UI
        run: make build-ui

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          OUT="bin/plume-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then OUT="${OUT}.exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X ipmanlk/plume/internal/version.Version=${VERSION}" \
            -o "${OUT}" ./cmd/server

      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          files: bin/plume-*
          generate_release_notes: true
