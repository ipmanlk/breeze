info:
  contact: {}
  description: Self-hosted project management tool API
  title: Plume API
  version: "1.0"
paths:
  /account:
    patch:
      consumes:
      - application/json
      description: Changes the caller's display name (synced across all workspaces)
      parameters:
      - description: Profile update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Update own profile
      tags:
      - account
  /account/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an avatar image for the caller's account (synced across
        all workspaces)
      parameters:
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Upload avatar
      tags:
      - account
  /account/change-password:
    post:
      consumes:
      - application/json
      description: Changes the caller's password (current password required); revokes
        sessions on success
      parameters:
      - description: Password change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Change password
      tags:
      - account
  /api/version:
    get:
      description: Returns the running build version
      produces:
      - application/json
      responses:
        "200":
          description: build version
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Version
      tags:
      - health
  /attachments/{attachmentId}/download:
    get:
      description: Streams the file content for download
      parameters:
      - description: Attachment ID
        in: path
        name: attachmentId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Download an attachment
      tags:
      - attachments
  /audit-log:
    get:
      description: Returns the org's audit log (admin actions), newest first. Filter
        by action or actor.
      parameters:
      - description: Max results per page (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter by action type (e.g. role_changed)
        in: query
        name: action
        type: string
      - description: Filter by actor user ID
        in: query
        name: actor_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuditLogResponse'
      summary: List audit log entries
      tags:
      - audit-log
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, sets HttpOnly cookie
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the auth cookie and invalidates the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.SuccessResponse'
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's profile with org info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Get current user
      tags:
      - auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: Completes a password reset with the token from the reset link and
        a new password
      parameters:
      - description: Token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ConfirmPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Confirm password reset
      tags:
      - auth
  /auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: Generates a password reset token (logged server-side; no SMTP configured
        for self-hosters)
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.SuccessResponse'
      summary: Request password reset
      tags:
      - auth
  /auth/password-reset/validate:
    get:
      description: Checks if a password-reset token is valid (exists, not expired,
        not used) without consuming it. Returns 200 with valid=true or 400 with valid=false.
      parameters:
      - description: Reset token from the email
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{\"valid\": true}'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: '{\"valid\": false}'
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Validate password reset token
      tags:
      - auth
  /auth/sessions:
    get:
      description: Returns the caller's active + recently-revoked sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SessionResponse'
            type: array
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Revokes one of the caller's other sessions ("log out" that device).
        The current session cannot be revoked here; use /auth/logout.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Revoke a session
      tags:
      - auth
  /avatars/{id}:
    get:
      description: Returns the avatar image for a user. Requires authentication.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Avatar image
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Get user avatar
      tags:
      - users
  /backup/download:
    get:
      description: Creates a VACUUM INTO snapshot of the SQLite database and streams
        it as a downloadable .db file.
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Download database backup
      tags:
      - backup
  /backup/restore:
    post:
      consumes:
      - multipart/form-data
      description: Accepts an uploaded .db backup file, validates it, and stages it
        for restore. The server must be restarted to apply the restore.
      parameters:
      - description: Uploaded .db backup file
        in: formData
        name: file
        required: true
        type: file
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BackupRestoreResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
