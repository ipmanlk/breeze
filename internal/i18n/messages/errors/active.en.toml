# User-facing error messages (source locale: en).
# These correspond to apperr sentinel errors, surfaced to the API consumer.
# The apperr sentinel itself stays English (internal); this catalog provides
# the localized, user-facing message returned in the ErrorResponse.Message.
#
# This file covers both the apperr sentinels handled by RespondWithError AND
# the direct ErrorJSON message strings in internal/transport/handler/ and
# internal/transport/middleware/. Each [MessageID] maps to a LocalizedErrorJSON
# call with the same message ID.

[ErrNotFound]
other = "resource not found"

[ErrForbidden]
other = "insufficient permissions"

[ErrForbiddenViewer]
other = "viewers cannot perform this action"

[ErrInvalidCreds]
other = "invalid email or password"

[ErrUserDeactivated]
other = "user account is deactivated"

[ErrSessionExpired]
other = "session expired"

[ErrSessionNotFound]
other = "invalid or expired session"

[ErrSetupComplete]
other = "setup already completed"

[ErrAlreadyExists]
other = "resource already exists"

[ErrInternal]
other = "internal error"

